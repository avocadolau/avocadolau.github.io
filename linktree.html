<!DOCTYPE HTML>

<html>
	<head>
		<title>Laura | Videogame Developer</title>
		<link rel="icon" type="image/png" href="media/Website/avatar_pixel.png">
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
		<link rel="stylesheet" href="assets/css/main.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
	</head>
	<body>
		<!-- Presentation -->
		<section class="hero">
			<div class="wrap hero-layout">

				<!-- Image -->
				<div class="hero-image-card">

					<figure class="hero-image">
						 <img
						 src="media/Website/avatar_pixel.png"
						 alt="Pixel art avatar of Laura"
						 >
					</figure> 
				</div>

				<!-- Text -->
				<div class="hero-content">
					
					<h1>Laura Isidro Gomez</h1>
					<span class="eyebrow">LINKS</span>
					
					<div class="linktree">

						<a href="https://lauraisidro.com" target="_blank" rel="noopener noreferrer">
							<i class="btn-icon fa-solid fa-globe"></i>
							WEBSITE
						</a>

						<a href="https://github.com/avocadolau" target="_blank" rel="noopener noreferrer">
							<i class="fa-brands fa-github"></i>
							GITHUB
						</a>

						<a href="https://www.linkedin.com/in/laura-isidro-590930180/" target="_blank" rel="noopener noreferrer">
							<i class="fa-brands fa-linkedin"></i>
							LINKEDIN
						</a>
					</div>
				</div>

			</div>
		</section>

		
		
		<footer id="site-footer" class="footer-arcade"></footer>

		<script>
			document.addEventListener('DOMContentLoaded', function () {
			var tabs = document.querySelectorAll('.stage-tab');
			var cards = document.querySelectorAll('.project-card');

			function setFilter(filter) {
				cards.forEach(function (card) {
				var show = card.dataset.category === filter;
				card.classList.toggle('is-hidden', !show);
				});
				tabs.forEach(function (tab) {
				var active = tab.dataset.filter === filter;
				tab.classList.toggle('is-active', active);
				tab.setAttribute('aria-selected', active ? 'true' : 'false');
				});
			}

			tabs.forEach(function (tab) {
				tab.addEventListener('click', function () {
				setFilter(tab.dataset.filter);
				});
			});

			// Estado inicial: muestra "professional" al cargar la página
			setFilter('professional');
			});
		</script>

		<script src="assets/js/components.js"></script>
		<script>
			loadNav();
			loadFooter();
		</script>
	</body>
</html>
